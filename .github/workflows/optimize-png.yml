name: KURMET lossless PNG optimization preview

on:
  push:
    branches:
      - optimize-png
    paths:
      - .github/workflows/optimize-png.yml
      - tools/optimize_png.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-optimized-assets:
    if: github.ref_name == 'optimize-png'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<12"
      - name: Encode and verify lossless WebP candidates
        run: python tools/optimize_png.py
      - name: Commit candidates to test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimized/
          if git diff --cached --quiet; then
            echo "No optimized assets changed."
          else
            git commit -m "Add verified lossless WebP candidates [skip ci]"
            git push origin HEAD:optimize-png
          fi
